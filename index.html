<style>
:root{--bg:#FAF4EC;--surface:#FFFDF9;--surface-soft:#F3ECE2;--sidebar:#D2DBCE;--sidebar-hover:rgba(250,244,236,.45);--sidebar-active:#FAF4EC;--ink:#272420;--ink-muted:#7C756C;--ink-subtle:#A69E94;--forest:#2F4838;--peach:#F6D5BE;--peach-deep:#E58565;--sage:#DCE5D5;--sage-badge:#769780;--coral:#FAD4C5;--coral-badge:#E48567;--butter:#F8E3B5;--butter-badge:#E1B14C;--sky:#D3DFEC;--sky-badge:#6D8FB2;--border:#EFE6DA;--radius-xl:26px;--radius-lg:22px;--radius-pill:999px;--shadow-soft:0 10px 30px rgba(47,40,32,.045);--shadow-card:0 4px 16px rgba(47,40,32,.035);--spring:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;padding:0;width:100%;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Display","Inter","PingFang TC","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;overflow-x:hidden}
.app-shell{display:flex;min-height:100dvh;padding:18px;gap:24px;max-width:1440px;margin:0 auto}
.sidebar{width:246px;flex-shrink:0;background:var(--sidebar);border-radius:var(--radius-xl);padding:18px 14px 14px;display:flex;flex-direction:column;justify-content:space-between;position:sticky;top:18px;height:calc(100dvh - 36px);transition:width .32s var(--spring),transform .32s var(--spring);z-index:40}
.sidebar.collapsed{width:82px}
.sidebar.collapsed .brand-text,.sidebar.collapsed .nav-placeholder,.sidebar.collapsed .nav-chevron,.sidebar.collapsed .side-card,.sidebar.collapsed .profile-meta,.sidebar.collapsed .nav-label{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:11px}
.sidebar.collapsed .profile-pill{justify-content:center;padding:8px}
.brand-row{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 16px;gap:10px}
.brand-left{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:13px;background:var(--forest);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:16px;flex-shrink:0}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-name{font-weight:700;font-size:16px;line-height:1.2}
.brand-sub{font-size:11px;color:#5C6759;margin-top:2px}
.icon-btn{width:34px;height:34px;border-radius:11px;border:none;background:rgba(250,244,236,.55);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .2s var(--spring);flex-shrink:0}
.icon-btn:hover{background:rgba(250,244,236,.85)}
.icon-btn:active{transform:scale(.93)}
.nav-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.nav-item{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:14px;border:none;background:transparent;color:#465045;cursor:pointer;width:100%;transition:background .22s,transform .22s var(--spring),color .2s}
.nav-item:hover{background:var(--sidebar-hover)}
.nav-item:active{transform:scale(.98)}
.nav-item.active{background:var(--sidebar-active);color:var(--ink);box-shadow:0 3px 10px rgba(47,40,32,.05)}
.nav-left{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.nav-label{font-size:14px;font-weight:600}
.nav-placeholder{height:8px;border-radius:99px;background:rgba(70,80,69,.2)}
.nav-item.active .nav-placeholder{background:rgba(39,36,32,.26)}
.nav-chevron{color:#798476;opacity:.75;flex-shrink:0}
.sidebar-footer{display:flex;flex-direction:column;gap:12px}
.side-card{background:var(--peach);border-radius:20px;padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.side-card-icon{width:34px;height:34px;border-radius:12px;background:rgba(255,253,249,.65);color:#C97642;display:grid;place-items:center}
.side-bars{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.bar-line{height:8px;border-radius:99px;background:rgba(39,36,32,.14)}
.bar-line.soft{height:6px;background:rgba(39,36,32,.09)}
.pill-cta{border:none;background:var(--peach-deep);color:#FFFDF9;border-radius:var(--radius-pill);height:32px;padding:0 18px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .2s var(--spring),filter .2s}
.pill-cta:hover{filter:brightness(.96)}
.pill-cta:active{transform:scale(.95)}
.profile-pill{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:rgba(250,244,236,.55)}
.avatar{width:34px;height:34px;border-radius:50%;background:#E8EDE4;border:2px solid #FAF4EC;color:var(--forest);font-weight:700;font-size:13px;display:grid;place-items:center;flex-shrink:0}
.profile-meta{display:flex;flex-direction:column;min-width:0}
.profile-name{font-size:13px;font-weight:700;line-height:1.2}
.profile-handle{font-size:11px;color:#657163;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px;padding-top:4px;padding-bottom:24px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar-left{display:flex;align-items:center;gap:10px}
.menu-trigger{display:none;width:38px;height:38px;border-radius:13px;border:1px solid var(--border);background:var(--surface);color:var(--ink);place-items:center;cursor:pointer}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-muted)}
.breadcrumb strong{color:var(--ink);font-weight:600}
.topbar-right{display:flex;align-items:center;gap:10px}
.search-pill{display:flex;align-items:center;gap:8px;background:var(--surface-soft);border:1px solid transparent;border-radius:var(--radius-pill);padding:0 14px;height:38px;width:220px;transition:border-color .2s,background .2s,width .25s var(--spring)}
.search-pill:focus-within{background:var(--surface);border-color:#DFD4C4;width:260px}
.search-pill input{border:none;background:transparent;outline:none;font-size:13px;color:var(--ink);width:100%;font-family:inherit;user-select:text;-webkit-user-select:text}
.kbd-tag{font-size:11px;color:var(--ink-muted);background:rgba(255,253,249,.8);padding:2px 6px;border-radius:6px;flex-shrink:0}
.top-action{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--ink-muted);display:grid;place-items:center;cursor:pointer;transition:transform .2s var(--spring),color .2s,border-color .2s}
.top-action:hover{color:var(--ink);border-color:#DCD0BF}
.top-action:active{transform:scale(.92)}
.greeting-block{padding:2px 2px 0}
.greeting-title{margin:0;font-size:clamp(26px,3vw,34px);font-weight:700;letter-spacing:-.025em;line-height:1.18}
.greeting-sub{margin:6px 0 0;font-size:13px;color:var(--ink-muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot-sep{width:4px;height:4px;border-radius:50%;background:var(--ink-subtle);display:inline-block}
.bento-top{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(0,1fr);gap:18px;align-items:stretch}
.hero-card{background:linear-gradient(135deg,#F7DAC4 0%,#F4CEB5 100%);border-radius:var(--radius-xl);padding:26px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:var(--shadow-soft);position:relative;overflow:hidden;min-height:252px}
.hero-left{display:flex;flex-direction:column;justify-content:space-between;gap:18px;flex:1;min-width:0;z-index:2}
.status-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,253,249,.78);border-radius:var(--radius-pill);padding:6px 12px;font-size:12px;font-weight:600;width:fit-content}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--peach-deep);animation:pulse 2.2s infinite ease-in-out}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.55}}
.hero-slot-lines{display:flex;flex-direction:column;gap:10px;max-width:240px}
.hero-bar-lg{height:18px;width:86%;border-radius:99px;background:rgba(39,36,32,.16)}
.hero-bar-sm{height:10px;width:58%;border-radius:99px;background:rgba(39,36,32,.09)}
.hero-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn-warm{border:none;height:40px;padding:0 18px;border-radius:var(--radius-pill);background:var(--peach-deep);color:#FFFDF9;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 6px 16px rgba(229,133,101,.28);transition:transform .22s var(--spring)}
.btn-warm:active{transform:scale(.95)}
.btn-cream{border:none;height:40px;padding:0 16px;border-radius:var(--radius-pill);background:rgba(255,253,249,.85);color:var(--ink);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:transform .22s var(--spring),background .2s}
.btn-cream:hover{background:#FFFDF9}
.btn-cream:active{transform:scale(.95)}
.hero-progress-row{display:flex;align-items:center;gap:12px;margin-top:2px}
.ring-wrap{position:relative;width:44px;height:44px;display:grid;place-items:center;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-text{position:absolute;font-size:10px;font-weight:700}
.hero-visual{width:196px;height:196px;flex-shrink:0;display:grid;place-items:center;position:relative;z-index:2}
#ambientCanvas{width:196px;height:196px;display:block}
.pastel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.module-card{border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:122px;border:2px solid transparent;cursor:pointer;text-align:left;transition:transform .26s var(--spring),box-shadow .26s,border-color .2s;box-shadow:var(--shadow-card)}
.module-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(47,40,32,.07)}
.module-card:active{transform:scale(.97)}
.module-card.selected{border-color:rgba(47,72,56,.35)}
.card-sage{background:var(--sage)}.card-coral{background:var(--coral)}.card-butter{background:var(--butter)}.card-sky{background:var(--sky)}
.badge-box{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#FFFDF9}
.badge-sage{background:var(--sage-badge)}.badge-coral{background:var(--coral-badge)}.badge-butter{background:var(--butter-badge)}.badge-sky{background:var(--sky-badge)}
.card-bars{display:flex;flex-direction:column;gap:8px}
.card-bar-main{height:15px;width:52%;border-radius:99px;background:rgba(39,36,32,.17)}
.card-bar-sub{height:8px;width:78%;border-radius:99px;background:rgba(39,36,32,.09)}
.bento-bottom{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(0,1fr);gap:18px}
.panel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:22px 24px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:18px;min-height:220px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-title-bars{display:flex;flex-direction:column;gap:7px;flex:1}
.seg-toggle{display:inline-flex;background:var(--surface-soft);padding:3px;border-radius:var(--radius-pill);gap:2px}
.seg-btn{border:none;background:transparent;color:var(--ink-muted);height:26px;padding:0 12px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.seg-btn.active{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(47,40,32,.06)}
.bars-stage{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;height:126px;padding-top:10px}
.v-bar-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;cursor:pointer}
.v-bar{width:100%;max-width:34px;border-radius:10px 10px 6px 6px;background:#E9DFD3;transition:height .45s var(--spring),background .25s,transform .2s var(--spring)}
.v-bar-col:hover .v-bar,.v-bar-col.active .v-bar{background:var(--sky-badge);transform:translateY(-2px)}
.v-bar-col.accent .v-bar{background:#9FB6CE}
.v-bar-col.accent.active .v-bar{background:var(--peach-deep)}
.v-dot{width:16px;height:5px;border-radius:99px;background:#EAE1D6}
.mix-strip{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:4px}
.mix-seg{height:100%;border-radius:99px;transition:flex-grow .45s var(--spring)}
.mix-list{display:flex;flex-direction:column;gap:14px;margin-top:2px}
.mix-row{display:flex;align-items:center;gap:12px}
.mix-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.mix-track{flex:1;height:8px;border-radius:99px;background:var(--surface-soft);overflow:hidden}
.mix-fill{height:100%;border-radius:99px;transition:width .5s var(--spring)}
.mobile-dock{display:none}
.backdrop{display:none;position:fixed;inset:0;background:rgba(39,36,32,.24);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:35}
.backdrop.open{display:block}
.modal-overlay{position:fixed;inset:0;background:rgba(39,36,32,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;place-items:center;padding:20px;z-index:60}
.modal-overlay.open{display:grid}
.modal-card{background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:24px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(39,36,32,.16);display:flex;flex-direction:column;gap:16px}
.modal-head{display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:17px;font-weight:700;margin:0}
.modal-steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.5;color:var(--ink-muted)}
.modal-steps strong{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--forest);color:var(--bg);padding:10px 18px;border-radius:var(--radius-pill);font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s var(--spring);z-index:70}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1023px){.app-shell{padding:16px;gap:0}.sidebar{position:fixed;top:14px;left:14px;height:calc(100dvh - 28px);transform:translateX(calc(-100% - 24px));box-shadow:0 20px 50px rgba(39,36,32,.18)}.sidebar.open{transform:translateX(0)}.menu-trigger{display:grid}.bento-top{grid-template-columns:1fr}.pastel-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.bento-bottom{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:767px){.app-shell{padding:calc(12px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}.search-pill{display:none}.hero-card{flex-direction:column-reverse;align-items:stretch;padding:20px;min-height:auto;gap:14px}.hero-visual,#ambientCanvas{width:148px;height:148px;margin:0 auto}.pastel-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.module-card{padding:15px;min-height:112px}.bento-bottom{grid-template-columns:1fr;gap:14px}.panel-card{padding:18px}.mobile-dock{display:flex;position:fixed;left:14px;right:14px;bottom:max(12px,env(safe-area-inset-bottom));height:62px;background:rgba(210,219,206,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,253,249,.55);border-radius:22px;padding:6px 10px;align-items:center;justify-content:space-around;box-shadow:0 12px 32px rgba(39,36,32,.12);z-index:30}.dock-btn{width:46px;height:46px;border-radius:15px;border:none;background:transparent;color:#465045;display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .2s var(--spring),color .2s}.dock-btn.active{background:var(--bg);color:var(--ink);box-shadow:0 3px 10px rgba(39,36,32,.08)}.dock-btn:active{transform:scale(.92)}.toast{bottom:calc(84px + env(safe-area-inset-bottom))}}
</style>
