<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="application-name" content="Wesley">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wesley">
<meta name="theme-color" content="#FAF4EC">
<title>Wesley</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#F47B5B;
  --accent-rgb:244,123,91;
  --accent-deep:#D85D3E;
  --accent-soft:rgba(244,123,91,.16);
  --bg:#F7F3EE;
  --text:#1F2328;
  --muted:#6A707A;
  --glass:rgba(255,255,255,.58);
  --glass-strong:rgba(255,255,255,.76);
  --glass-border:rgba(255,255,255,.72);
  --shadow:0 16px 40px rgba(31,35,40,.08);
  --radius:26px;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --smooth:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after,html,body,h1,h2,h3,h4,h5,h6,b,strong,button,input,select,textarea{
  box-sizing:border-box;
  font-family:'Google Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-weight:400 !important;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
  touch-action:manipulation;
}
button{border:none;background:none;color:inherit;cursor:pointer;padding:0;font:inherit;}
input{font:inherit;color:inherit;}
.glass{
  background:var(--glass);
  backdrop-filter:blur(26px) saturate(165%);
  -webkit-backdrop-filter:blur(26px) saturate(165%);
  border:1px solid var(--glass-border);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.75);
}
.wallpaper{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
  background:radial-gradient(circle at 20% 20%,rgba(var(--accent-rgb),.14),transparent 55%),linear-gradient(145deg,#FBF7F2 0%,#F2EDE7 50%,#EAE6F0 100%);
}
.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(85px);
  -webkit-filter:blur(85px);
  opacity:.62;
  will-change:transform;
  transition:background .8s var(--smooth);
}
.blob-1{
  width:52vw;height:52vw;max-width:680px;max-height:680px;
  top:-14%;left:-10%;
  background:radial-gradient(circle,rgba(var(--accent-rgb),.55),rgba(var(--accent-rgb),.08) 70%);
  animation:floatA 18s ease-in-out infinite alternate;
}
.blob-2{
  width:46vw;height:46vw;max-width:600px;max-height:600px;
  top:18%;right:-10%;
  background:radial-gradient(circle,rgba(95,158,126,.42),rgba(74,144,217,.12) 70%);
  animation:floatB 22s ease-in-out infinite alternate;
}
.blob-3{
  width:48vw;height:48vw;max-width:620px;max-height:620px;
  bottom:-18%;left:22%;
  background:radial-gradient(circle,rgba(var(--accent-rgb),.36),rgba(139,108,226,.22) 70%);
  animation:floatC 25s ease-in-out infinite alternate;
}
@keyframes floatA{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(8vw,6vh,0) scale(1.12)}}
@keyframes floatB{0%{transform:translate3d(0,0,0) scale(1.05)}100%{transform:translate3d(-9vw,8vh,0) scale(.94)}}
@keyframes floatC{0%{transform:translate3d(0,0,0) scale(.96)}100%{transform:translate3d(6vw,-7vh,0) scale(1.1)}}

.app-shell{
  position:relative;
  z-index:1;
  display:flex;
  min-height:100vh;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
.sidebar{
  width:248px;
  flex-shrink:0;
  margin:18px 0 18px 18px;
  border-radius:30px;
  padding:22px 16px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  position:sticky;
  top:16px;
  height:calc(100vh - 32px);
  transition:transform .42s var(--smooth);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:6px 10px 20px;
}
.brand-mark{
  width:38px;height:38px;border-radius:14px;
  background:linear-gradient(135deg,var(--accent),rgba(var(--accent-rgb),.72));
  color:#fff;
  display:grid;place-items:center;
  box-shadow:0 8px 20px rgba(var(--accent-rgb),.28);
}
.brand-title{font-size:20px;letter-spacing:-.02em;}
.nav-list{display:flex;flex-direction:column;gap:6px;}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:16px;
  color:var(--muted);
  transition:background .25s,color .25s,transform .35s var(--spring);
  text-align:left;width:100%;
}
.nav-item:hover{background:rgba(255,255,255,.55);color:var(--text);transform:translateX(2px);}
.nav-item.active{
  background:var(--glass-strong);
  color:var(--text);
  box-shadow:0 6px 18px rgba(31,35,40,.06),inset 0 0 0 1px rgba(var(--accent-rgb),.28);
}
.nav-item.active svg{color:var(--accent);}
.profile-card{margin-top:auto;
  display:flex;align-items:center;gap:11px;
  padding:12px;border-radius:20px;
  background:rgba(255,255,255,.52);
  border:1px solid rgba(255,255,255,.7);
}
.avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),rgba(var(--accent-rgb),.65));
  color:#fff;display:grid;place-items:center;font-size:16px;flex-shrink:0;
}
.profile-meta{min-width:0;}
.profile-name{font-size:14px;color:var(--text);}
.profile-handle{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.main{
  flex:1;
  min-width:0;
  padding:18px 24px 36px;
  display:flex;
  flex-direction:column;
  gap:20px;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.top-left{display:flex;align-items:center;gap:10px;}
.menu-btn{
  width:40px;height:40px;border-radius:14px;
  display:none;place-items:center;
}
.crumb-pill{
  display:flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:999px;font-size:14px;
}
.crumb-sep{color:var(--muted);opacity:.6;}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.pill-btn{
  display:flex;align-items:center;gap:7px;
  height:40px;padding:0 14px;border-radius:999px;
  font-size:13px;
  transition:transform .3s var(--spring),background .25s;
}
.pill-btn:active{transform:scale(.95);}
.accent-pill{
  display:flex;align-items:center;gap:7px;
  height:40px;padding:0 12px;border-radius:999px;
}
.dot{
  width:18px;height:18px;border-radius:50%;
  position:relative;transition:transform .35s var(--spring),box-shadow .25s;
  border:2px solid rgba(255,255,255,.85);
}
.dot:hover{transform:scale(1.16);}
.dot.active{transform:scale(1.2);box-shadow:0 0 0 2px var(--text);}
.dot-rainbow{
  background:conic-gradient(#F47B5B,#E59A38,#5F9E7E,#4A90D9,#8B6CE2,#F47B5B);
  overflow:hidden;
}
.dot-rainbow input[type=color]{
  position:absolute;inset:-6px;width:30px;height:30px;opacity:0;cursor:pointer;
}
.search-pill{
  height:40px;padding:0 14px;border-radius:999px;
  display:flex;align-items:center;gap:10px;
  min-width:168px;justify-content:space-between;
  color:var(--muted);font-size:13px;
  transition:transform .3s var(--spring);
}
.search-pill:hover{transform:translateY(-1px);}
.kbd{
  padding:2px 7px;border-radius:8px;
  background:rgba(255,255,255,.68);
  border:1px solid rgba(31,35,40,.08);
  font-size:11px;color:var(--text);
}
.top-avatar{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),rgba(var(--accent-rgb),.68));
  color:#fff;display:grid;place-items:center;font-size:15px;
  box-shadow:0 8px 18px rgba(var(--accent-rgb),.26);
}

.greeting-row{
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:2px 4px;
}
.greeting-title{font-size:clamp(26px,3.2vw,34px);letter-spacing:-.025em;margin:0;line-height:1.18;}
.greeting-sub{font-size:14px;color:var(--muted);margin:6px 0 0;}

.bento-top{
  display:grid;
  grid-template-columns:1.35fr 1fr;
  gap:18px;
}
.hero-card{
  border-radius:30px;
  padding:26px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  min-height:276px;
  background:linear-gradient(135deg,rgba(var(--accent-rgb),.22) 0%,rgba(255,255,255,.64) 55%,rgba(var(--accent-rgb),.12) 100%);
}
.hero-left{display:flex;flex-direction:column;justify-content:space-between;gap:18px;z-index:1;min-width:0;}
.hero-chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.chip{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 13px;border-radius:999px;
  background:rgba(255,255,255,.68);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.8);
  font-size:13px;
}
.clock-digits{
  font-size:clamp(40px,5vw,60px);
  letter-spacing:-.03em;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.clock-full-date{font-size:15px;color:var(--muted);margin-top:8px;}
.hero-right{
  width:196px;height:196px;flex-shrink:0;
  display:grid;place-items:center;position:relative;
}
.orbital-svg{width:100%;height:100%;overflow:visible;}
.orbit-center-w{
  position:absolute;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),rgba(var(--accent-rgb),.78));
  color:#fff;display:grid;place-items:center;font-size:22px;
  box-shadow:0 0 28px rgba(var(--accent-rgb),.58),inset 0 1px 2px rgba(255,255,255,.6);
}

.mini-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}
.mini-card{
  border-radius:24px;
  padding:18px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:131px;
  position:relative;
  transition:transform .38s var(--spring),box-shadow .3s;
  cursor:pointer;
}
.mini-card:hover{transform:translateY(-3px);}
.mini-card:active{transform:scale(.97);}
.mini-peach{
  background:linear-gradient(145deg,rgba(255,220,198,.82),rgba(255,240,228,.66));
  border-color:rgba(255,255,255,.85);
}
.mini-top{display:flex;align-items:center;justify-content:space-between;}
.mini-icon{
  width:54px;height:54px;border-radius:16px;
  display:grid;place-items:center;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.85);
}
.mini-arrow{
  width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.55);
  color:var(--text);
}
.mini-label{font-size:12px;color:var(--muted);margin-top:12px;}
.mini-value{font-size:17px;margin-top:3px;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.bento-bottom{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.data-card{
  border-radius:28px;
  padding:22px;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.card-title{font-size:17px;margin:0;}
.card-sub{font-size:12px;color:var(--muted);margin:3px 0 0;}
.seg-switch{
  display:inline-flex;padding:3px;border-radius:999px;
  background:rgba(255,255,255,.56);border:1px solid rgba(255,255,255,.8);
}
.seg-btn{
  padding:5px 13px;border-radius:999px;font-size:12px;color:var(--muted);
  transition:background .25s,color .25s;
}
.seg-btn.active{background:#fff;color:var(--text);box-shadow:0 3px 10px rgba(31,35,40,.08);}
.bar-chart{
  height:164px;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:12px;
  align-items:end;
  padding-top:12px;
}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;}
.bar-track{
  width:100%;max-width:34px;height:126px;border-radius:12px;
  background:rgba(255,255,255,.45);
  display:flex;align-items:flex-end;overflow:hidden;
  border:1px solid rgba(255,255,255,.65);
}
.bar-fill{
  width:100%;border-radius:10px;
  background:rgba(31,35,40,.16);
  transition:height .55s var(--spring),background .35s;
}
.bar-fill.peak{
  background:linear-gradient(180deg,var(--accent),rgba(var(--accent-rgb),.72));
  box-shadow:0 6px 16px rgba(var(--accent-rgb),.28);
}
.bar-day{font-size:12px;color:var(--muted);}

.icon-btn{
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.68);
  border:1px solid rgba(255,255,255,.85);
  display:grid;place-items:center;
  transition:transform .4s var(--spring);
}
.icon-btn:active{transform:rotate(-90deg) scale(.92);}
.multi-bar{
  height:14px;border-radius:999px;
  background:rgba(255,255,255,.5);
  overflow:hidden;display:flex;gap:3px;padding:2px;
  border:1px solid rgba(255,255,255,.75);
}
.multi-seg{height:100%;border-radius:999px;transition:width .5s var(--spring);}
.prog-list{display:flex;flex-direction:column;gap:12px;}
.prog-row{display:flex;flex-direction:column;gap:6px;}
.prog-meta{display:flex;justify-content:space-between;font-size:13px;}
.prog-track{height:8px;border-radius:999px;background:rgba(255,255,255,.52);overflow:hidden;}
.prog-fill{height:100%;border-radius:999px;transition:width .55s var(--spring);}

.draw-panel{
  border-radius:30px;
  padding:24px;
  display:none;
  flex-direction:column;
  gap:20px;
  transform-origin:top center;
  animation:springIn .48s var(--spring);
}
.draw-panel.open{display:flex;}
@keyframes springIn{0%{opacity:0;transform:scale(.94) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.draw-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.draw-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.subject-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:12px;
}
.subj-card{
  border-radius:20px;padding:14px 10px;
  background:rgba(255,255,255,.56);
  border:1px solid rgba(255,255,255,.8);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:transform .38s var(--spring),box-shadow .25s,opacity .25s,background .25s;
}
.subj-card.picking{transform:scale(1.07);box-shadow:0 0 0 2px var(--accent),0 12px 24px rgba(var(--accent-rgb),.24);background:rgba(255,255,255,.88);}
.subj-card.chosen{transform:scale(1.08);box-shadow:0 0 0 2px var(--accent),0 14px 28px rgba(var(--accent-rgb),.32);background:#fff;}
.subj-card.used{opacity:.42;}
.subj-icon{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;}
.subj-name{font-size:14px;}
.subj-count{font-size:11px;color:var(--muted);}
.draw-stage{
  display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:stretch;
}
.draw-result-box{
  border-radius:24px;padding:22px;
  background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
}
.draw-btn{
  padding:12px 26px;border-radius:999px;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));
  color:#fff;font-size:15px;
  box-shadow:0 10px 24px rgba(var(--accent-rgb),.32);
  transition:transform .35s var(--spring);
}
.draw-btn:hover{transform:translateY(-2px) scale(1.02);}
.draw-btn:active{transform:scale(.95);}
.history-box{
  border-radius:24px;padding:18px;
  background:rgba(255,255,255,.52);border:1px solid rgba(255,255,255,.8);
  display:flex;flex-direction:column;gap:10px;max-height:220px;overflow-y:auto;
}
.history-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.62);font-size:13px;
}

.modal-backdrop{
  position:fixed;inset:0;z-index:50;
  background:rgba(25,28,34,.22);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  display:none;place-items:center;padding:20px;
}
.modal-backdrop.open{display:grid;}
.modal-card{
  width:100%;max-width:440px;border-radius:28px;padding:22px;
  animation:springIn .4s var(--spring);
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.search-input{
  width:100%;padding:12px 16px;border-radius:16px;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);
  outline:none;font-size:15px;margin-bottom:12px;
}
.cmd-list{display:flex;flex-direction:column;gap:6px;}
.cmd-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.46);
  font-size:14px;text-align:left;width:100%;
}
.cmd-item:hover{background:rgba(255,255,255,.82);}
.todo-row{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;
  background:rgba(255,255,255,.58);margin-bottom:8px;cursor:pointer;
}
.todo-check{
  width:20px;height:20px;border-radius:7px;border:1.5px solid var(--accent);
  display:grid;place-items:center;flex-shrink:0;
}
.todo-row.done .todo-check{background:var(--accent);color:#fff;}
.todo-row.done span{text-decoration:line-through;color:var(--muted);}

.drawer-overlay{
  position:fixed;inset:0;z-index:39;background:rgba(20,24,30,.24);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;
}
.drawer-overlay.open{display:block;}
.mobile-nav{
  display:none;
  position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));
  z-index:35;border-radius:26px;padding:8px 10px;
  justify-content:space-around;align-items:center;
}
.mnav-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 12px;border-radius:16px;font-size:11px;color:var(--muted);
}
.mnav-btn.active{color:var(--accent);background:rgba(255,255,255,.65);}

@media (max-width:1024px){
  .menu-btn{display:grid;}
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;z-index:40;margin:0;
    height:100vh;border-radius:0 28px 28px 0;
    transform:translateX(-110%);
  }
  .sidebar.open{transform:translateX(0);}
  .bento-top{grid-template-columns:1fr;}
  .mini-grid{grid-template-columns:repeat(4,1fr);}
  .bento-bottom{grid-template-columns:1fr;}
  .subject-grid{grid-template-columns:repeat(3,1fr);}
  .draw-stage{grid-template-columns:1fr;}
}
@media (max-width:640px){
  .main{padding:14px 14px calc(92px + env(safe-area-inset-bottom));gap:16px;}
  .search-pill span.search-label{display:none;}
  .search-pill{min-width:auto;padding:0 12px;}
  .hero-card{flex-direction:column;align-items:flex-start;padding:22px;}
  .hero-right{width:154px;height:154px;align-self:center;}
  .mini-grid{grid-template-columns:repeat(2,1fr);}
  .subject-grid{grid-template-columns:repeat(2,1fr);}
  .mobile-nav{display:flex;}
}

let lang=localStorage.getItem('wesley_lang')||'zh';
let accent=localStorage.getItem('wesley_accent')||'#F47B5B';
let drawMode=localStorage.getItem('wesley_draw_mode')||'unique';
let usedIds=JSON.parse(localStorage.getItem('wesley_used')||'[]');
let history=JSON.parse(localStorage.getItem('wesley_history')||'[]');

let dsMode='A';
let timerSec=25*60,timerRun=false,timerId=null,drawing=false;

function hexToRgb(hex){
  const h=hex.replace('#','');
  const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  return `${(n>>16)&255},${(n>>8)&255},${n&255}`;
}
function applyAccent(hex){
  accent=hex;
  localStorage.setItem('wesley_accent',hex);
  const rgb=hexToRgb(hex);
  document.documentElement.style.setProperty('--accent',hex);
  document.documentElement.style.setProperty('--accent-deep',hex);
  document.documentElement.style.setProperty('--accent-rgb',rgb);
  document.documentElement.style.setProperty('--accent-soft',`rgba(${rgb},.16)`);
  let matched=false;
  document.querySelectorAll('#accentBar .dot[data-color]').forEach(d=>{
    const isMatch=d.dataset.color.toLowerCase()===hex.toLowerCase();
    d.classList.toggle('active',isMatch);
    if(isMatch)matched=true;
  });
  document.getElementById('customColorDot').classList.toggle('active',!matched);
  document.getElementById('customColorInput').value=hex;
}

function applyLang(){
  const t=I18N[lang];
  document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.dataset.i18n;
    if(t[k])el.textContent=t[k];
  });
  document.getElementById('weatherText').textContent=t.weather;
  document.getElementById('distSub').textContent=t.distSub;
  updateClock();
  renderDrawState();
  renderTasksCard();
  renderWater();
  renderChart();
  renderDist();
}

function updateClock(){
  const now=new Date();
  const h=now.getHours();
  const t=I18N[lang];
  const greet=h<12?t.morning:(h<18?t.afternoon:t.evening);
  document.getElementById('greetingText').textContent=greet;
  const pad=n=>String(n).padStart(2,'0');
  const timeStr=`${pad(h)}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('clockDigits').textContent=timeStr;
  const loc=lang==='zh'?'zh-HK':'en-US';
  const full=now.toLocaleDateString(loc,{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  const shortD=now.toLocaleDateString(loc,{month:'short',day:'numeric'});
  document.getElementById('clockFullDate').textContent=full;
  document.getElementById('dateChipText').textContent=shortD;
  document.getElementById('greetingSub').textContent=`${full} · ${timeStr}`;
  const sDeg=now.getSeconds()*6;
  const mDeg=now.getMinutes()*6+now.getSeconds()*0.1;
  const hDeg=(h%12)*30+now.getMinutes()*0.5;
  document.getElementById('orbitSec').setAttribute('transform',`rotate(${sDeg} 100 100)`);
  document.getElementById('orbitMin').setAttribute('transform',`rotate(${mDeg} 100 100)`);
  document.getElementById('orbitHour').setAttribute('transform',`rotate(${hDeg} 100 100)`);
}

function renderDrawState(){
  const t=I18N[lang];
  const last=history[0];
  const cardVal=document.getElementById('cardDrawValue');
  if(last){
    const s=SUBJECTS.find(x=>x.id===last.id)||SUBJECTS[0];
    cardVal.innerHTML=`<span style="color:${s.color};display:inline-flex">${s.svg}</span><span>${s.id}</span>`;
    document.getElementById('drawResultName').textContent=s.id;
    document.getElementById('drawPickedIcon').innerHTML=s.svg;
    document.getElementById('drawPickedIcon').style.color=s.color;
    document.getElementById('drawPickedIcon').style.background=s.bg;
  }else{
    cardVal.textContent=t.clickToDraw;
    document.getElementById('drawResultName').textContent=t.readyDraw;
  }
  document.getElementById('drawResultHint').textContent=t.readyHint;

  const counts={};
  SUBJECTS.forEach(s=>counts[s.id]=0);
  history.forEach(h=>{if(counts[h.id]!==undefined)counts[h.id]++;});
  document.getElementById('subjectGrid').innerHTML=SUBJECTS.map(s=>{
    const isUsed=drawMode==='unique'&&usedIds.includes(s.id);
    const isChosen=last&&last.id===s.id;
    return `<div class="subj-card ${isUsed?'used':''} ${isChosen?'chosen':''}" data-subj="${s.id}">
      <div class="subj-icon" style="background:${s.bg};color:${s.color}">${s.svg}</div>
      <div class="subj-name">${s.id}</div>
      <div class="subj-count">${counts[s.id]}</div>
    </div>`;
  }).join('');

  document.getElementById('historyList').innerHTML=history.length
    ?history.slice(0,12).map(h=>{
      const s=SUBJECTS.find(x=>x.id===h.id)||SUBJECTS[0];
      return `<div class="history-item"><span style="display:flex;align-items:center;gap:8px;color:${s.color}">${s.svg}<span style="color:var(--text)">${s.id}</span></span><span style="color:var(--muted)">${h.time}</span></div>`;
    }).join('')
    :`<div style="color:var(--muted);font-size:13px;padding:8px 0">${t.noHist}</div>`;

  document.querySelectorAll('#modeSwitch .seg-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.mode===drawMode);
  });
}

function runDraw(){
  if(drawing)return;
  let pool=drawMode==='unique'?SUBJECTS.filter(s=>!usedIds.includes(s.id)):SUBJECTS;
  if(!pool.length){usedIds=[];localStorage.setItem('wesley_used','[]');pool=SUBJECTS;}
  drawing=true;
  let step=0,total=14;
  const cards=[...document.querySelectorAll('.subj-card')];
  const iv=setInterval(()=>{
    cards.forEach(c=>c.classList.remove('picking'));
    const rnd=pool[Math.floor(Math.random()*pool.length)];
    const el=document.querySelector(`.subj-card[data-subj="${rnd.id}"]`);
    if(el)el.classList.add('picking');
    step++;
    if(step>=total){
      clearInterval(iv);
      cards.forEach(c=>c.classList.remove('picking'));
      const pick=pool[Math.floor(Math.random()*pool.length)];
      if(drawMode==='unique'){usedIds.push(pick.id);localStorage.setItem('wesley_used',JSON.stringify(usedIds));}
      const now=new Date();
      const tm=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      history.unshift({id:pick.id,time:tm});
      localStorage.setItem('wesley_history',JSON.stringify(history));
      drawing=false;
      renderDrawState();
      renderDist();
    }
  },75);
}

function renderChart(){
  const days=lang==='zh'?['一','二','三','四','五','六','日']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const vals=dsMode==='A'?[3,5,4,6,7,4,5]:[75,110,90,135,160,95,120];
  const max=Math.max(...vals);
  document.getElementById('chartSub').textContent=dsMode==='A'?I18N[lang].chartSubA:I18N[lang].chartSubB;
  document.getElementById('barChart').innerHTML=vals.map((v,i)=>{
    const pct=Math.round((v/max)*100);
    return `<div class="bar-col"><div class="bar-track"><div class="bar-fill ${v===max?'peak':''}" style="height:${pct}%"></div></div><span class="bar-day">${days[i]}</span></div>`;
  }).join('');
}

function renderDist(){
  const counts=SUBJECTS.map(s=>({
    ...s,
    c:history.filter(h=>h.id===s.id).length
  }));
  const total=counts.reduce((a,b)=>a+b.c,0);
  const top4=[...counts].sort((a,b)=>b.c-a.c).slice(0,4);
  document.getElementById('multiBar').innerHTML=total
    ?counts.filter(x=>x.c>0).map(x=>`<div class="multi-seg" style="width:${(x.c/total)*100}%;background:${x.color}"></div>`).join('')
    :`<div class="multi-seg" style="width:100%;background:rgba(var(--accent-rgb),.28)"></div>`;
  document.getElementById('progList').innerHTML=top4.map(x=>{
    const pct=total?Math.round((x.c/total)*100):0;
    return `<div class="prog-row"><div class="prog-meta"><span>${x.id}</span><span style="color:var(--muted)">${x.c} (${pct}%)</span></div><div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${x.color}"></div></div></div>`;
  }).join('');
}

function renderTasksCard(){
  const done=todos.filter(x=>x.d).length;

  document.getElementById('todoList').innerHTML=todos.map(x=>`

}

function toggleTimer(){
  if(timerRun){
    clearInterval(timerId);timerRun=false;
    document.getElementById('timerBadge').innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  }else{
    timerRun=true;
    document.getElementById('timerBadge').innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';
    timerId=setInterval(()=>{
      timerSec=timerSec>0?timerSec-1:25*60;
      const m=String(Math.floor(timerSec/60)).padStart(2,'0');
      const s=String(timerSec%60).padStart(2,'0');
      document.getElementById('cardTimerValue').textContent=`${m}:${s}`;
    },1000);
  }
}

"/></svg>':''}</div><span style="flex:1">${esc(x.t)}</span><button class="todo-del" type="button" data-del="${x.id}" aria-label="Delete"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>`).join('');const meta=document.getElementById('todoCountMeta');if(meta)meta.textContent=`${done} / ${todos.length}`;const card=document.getElementById('cardTasksValue');if(card)card.textContent=`${done} / ${todos.length} ${(I18N[lang]||I18N.zh).done}`;};const addTodo=()=>{const inp=document.getElementById('todoInput');if(!inp)return;const v=inp.value.trim();if(!v)return;todos.push({id:Date.now(),t:v,d:false});inp.value='';syncTodos();};document.getElementById('todoAddBtn')?.addEventListener('click',addTodo);document.getElementById('todoInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')addTodo();});document.getElementById('todoClearDoneBtn')?.addEventListener('click',()=>{todos=todos.filter(x=>!x.d);syncTodos();});document.getElementById('todoList')?.addEventListener('click',e=>{const del=e.target.closest('.todo-del');if(del){e.stopPropagation();const id=Number(del.dataset.del);todos=todos.filter(x=>x.id!==id);syncTodos();return;}const row=e.target.closest('.todo-row');if(row){const id=Number(row.dataset.tid);const it=todos.find(x=>x.id===id);if(it){it.d=!it.d;syncTodos();}}});syncTodos()})();</script>
