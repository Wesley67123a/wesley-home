<style>
:root{--bg:#FAF4EC;--surface:#FFFDF9;--surface-soft:#F3ECE2;--sidebar:#D2DBCE;--sidebar-hover:rgba(250,244,236,.45);--sidebar-active:#FAF4EC;--ink:#272420;--ink-muted:#7C756C;--ink-subtle:#A69E94;--forest:#2F4838;--peach:#F6D5BE;--peach-deep:#E58565;--sage:#DCE5D5;--sage-badge:#769780;--coral:#FAD4C5;--coral-badge:#E48567;--butter:#F8E3B5;--butter-badge:#E1B14C;--sky:#D3DFEC;--sky-badge:#6D8FB2;--lavender:#E4DCF0;--lavender-badge:#8B74B8;--mint:#D2EAE3;--mint-badge:#579989;--border:#EFE6DA;--radius-xl:26px;--radius-lg:22px;--radius-pill:999px;--shadow-soft:0 10px 30px rgba(47,40,32,.045);--shadow-card:0 4px 16px rgba(47,40,32,.035);--spring:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
html{background-color:#FAF4EC;overscroll-behavior-y:none}
html,body{margin:0;padding:0;width:100%;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Display","Inter","PingFang TC","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;overflow-x:hidden}
.app-shell{display:flex;min-height:100dvh;padding:18px;gap:24px;max-width:1440px;margin:0 auto}
.sidebar{width:246px;flex-shrink:0;background:var(--sidebar);border-radius:var(--radius-xl);padding:18px 14px 14px;display:flex;flex-direction:column;justify-content:space-between;position:sticky;top:18px;height:calc(100dvh - 36px);transition:width .32s var(--spring),transform .32s var(--spring);z-index:40}
.sidebar.collapsed{width:82px}
.sidebar.collapsed .brand-text,.sidebar.collapsed .nav-chevron,.sidebar.collapsed .side-card,.sidebar.collapsed .profile-meta,.sidebar.collapsed .nav-label{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:11px}
.sidebar.collapsed .profile-pill{justify-content:center;padding:8px}
.brand-row{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 16px;gap:10px}
.brand-left{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:13px;background:var(--forest);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:16px;flex-shrink:0}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-name{font-weight:700;font-size:16px;line-height:1.2}
.brand-sub{font-size:11px;color:#5C6759;margin-top:2px}
.icon-btn{width:34px;height:34px;border-radius:11px;border:none;background:rgba(250,244,236,.55);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .2s var(--spring);flex-shrink:0}
.icon-btn:hover{background:rgba(250,244,236,.85)}
.icon-btn:active{transform:scale(.93)}
.nav-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.nav-item{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:14px;border:none;background:transparent;color:#465045;cursor:pointer;width:100%;transition:background .22s,transform .22s var(--spring),color .2s}
.nav-item:hover{background:var(--sidebar-hover)}
.nav-item:active{transform:scale(.98)}
.nav-item.active{background:var(--sidebar-active);color:var(--ink);box-shadow:0 3px 10px rgba(47,40,32,.05)}
.nav-left{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.nav-label{font-size:14px;font-weight:600;white-space:nowrap}
.nav-chevron{color:#798476;opacity:.75;flex-shrink:0}
.sidebar-footer{display:flex;flex-direction:column;gap:12px}
.side-card{background:var(--peach);border-radius:20px;padding:15px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.side-card-icon{width:34px;height:34px;border-radius:12px;background:rgba(255,253,249,.72);color:#C97642;display:grid;place-items:center}
.side-card-title{font-size:13px;font-weight:700;color:var(--ink)}
.side-card-sub{font-size:11px;color:#735C4F;line-height:1.35}
.pill-cta{border:none;background:var(--peach-deep);color:#FFFDF9;border-radius:var(--radius-pill);height:32px;padding:0 16px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .2s var(--spring),filter .2s}
.pill-cta:hover{filter:brightness(.96)}
.pill-cta:active{transform:scale(.95)}
.profile-pill{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:rgba(250,244,236,.55)}
.avatar{width:34px;height:34px;border-radius:50%;background:#E8EDE4;border:2px solid #FAF4EC;color:var(--forest);font-weight:700;font-size:13px;display:grid;place-items:center;flex-shrink:0}
.profile-meta{display:flex;flex-direction:column;min-width:0}
.profile-name{font-size:13px;font-weight:700;line-height:1.2}
.profile-handle{font-size:11px;color:#657163;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px;padding-top:4px;padding-bottom:24px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar-left{display:flex;align-items:center;gap:10px}
.menu-trigger{display:none;width:38px;height:38px;border-radius:13px;border:1px solid var(--border);background:var(--surface);color:var(--ink);place-items:center;cursor:pointer}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-muted)}
.breadcrumb strong{color:var(--ink);font-weight:600}
.topbar-right{display:flex;align-items:center;gap:10px}
.search-pill{display:flex;align-items:center;gap:8px;background:var(--surface-soft);border:1px solid transparent;border-radius:var(--radius-pill);padding:0 14px;height:38px;width:220px;transition:border-color .2s,background .2s,width .25s var(--spring)}
.search-pill:focus-within{background:var(--surface);border-color:#DFD4C4;width:260px}
.search-pill input{border:none;background:transparent;outline:none;font-size:13px;color:var(--ink);width:100%;font-family:inherit;user-select:text;-webkit-user-select:text}
.search-pill input::placeholder{color:var(--ink-subtle)}
.kbd-tag{font-size:11px;color:var(--ink-muted);background:rgba(255,253,249,.8);padding:2px 6px;border-radius:6px;flex-shrink:0}
.greeting-block{padding:2px 2px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.greeting-title{margin:0;font-size:clamp(26px,3vw,34px);font-weight:700;letter-spacing:-.025em;line-height:1.18}
.greeting-sub{margin:6px 0 0;font-size:13px;color:var(--ink-muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot-sep{width:4px;height:4px;border-radius:50%;background:var(--ink-subtle);display:inline-block}
.bento-top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:stretch}
.hero-card{background:linear-gradient(135deg,#F7DAC4 0%,#F4CEB5 100%);border-radius:var(--radius-xl);padding:26px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:var(--shadow-soft);position:relative;overflow:hidden;min-height:264px}
.hero-left{display:flex;flex-direction:column;justify-content:space-between;gap:16px;flex:1;min-width:0;z-index:2}
.status-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,253,249,.82);border-radius:var(--radius-pill);padding:6px 12px;font-size:12px;font-weight:600;width:fit-content}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--peach-deep);animation:pulse 2.2s infinite ease-in-out}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.55}}
.draw-stage{display:flex;align-items:center;gap:16px;background:rgba(255,253,249,.64);border:1px solid rgba(255,253,249,.85);border-radius:20px;padding:14px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .28s var(--spring)}
.draw-stage.pop{transform:scale(1.025)}
.draw-icon-box{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:#FFFDF9;background:var(--forest);flex-shrink:0;box-shadow:0 6px 16px rgba(47,40,32,.12);transition:background .25s,transform .25s var(--spring)}
.draw-meta{display:flex;flex-direction:column;min-width:0}
.draw-code{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:var(--ink)}
.draw-name{font-size:13px;font-weight:600;color:#6E5A4F;margin-top:2px}
.hero-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn-warm{border:none;height:40px;padding:0 18px;border-radius:var(--radius-pill);background:var(--peach-deep);color:#FFFDF9;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 6px 16px rgba(229,133,101,.28);transition:transform .22s var(--spring),filter .2s}
.btn-warm:hover{filter:brightness(.97)}
.btn-warm:active{transform:scale(.95)}
.btn-warm:disabled{opacity:.65;cursor:not-allowed}
.btn-cream{border:none;height:40px;padding:0 14px;border-radius:var(--radius-pill);background:rgba(255,253,249,.85);color:var(--ink);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:transform .22s var(--spring),background .2s}
.btn-cream:hover{background:#FFFDF9}
.btn-cream:active{transform:scale(.95)}
.btn-cream.active{background:var(--forest);color:#FFFDF9}
.hero-progress-row{display:flex;align-items:center;gap:12px;margin-top:2px}
.ring-wrap{position:relative;width:42px;height:42px;display:grid;place-items:center;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-text{position:absolute;font-size:10px;font-weight:700}
.pool-hint{font-size:12px;color:#6E5A4F;font-weight:600}
.hero-visual{width:178px;height:178px;flex-shrink:0;display:grid;place-items:center;position:relative;z-index:2}
#ambientCanvas{width:178px;height:178px;display:block}
.subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.subject-card{border-radius:var(--radius-lg);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:84px;border:2px solid transparent;cursor:pointer;text-align:left;transition:transform .24s var(--spring),box-shadow .24s,border-color .2s,opacity .2s;box-shadow:var(--shadow-card);position:relative}
.subject-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(47,40,32,.07)}
.subject-card:active{transform:scale(.97)}
.subject-card.excluded{opacity:.42;filter:grayscale(.35)}
.subject-card.rolling{transform:scale(1.03);border-color:rgba(39,36,32,.35);box-shadow:0 10px 24px rgba(47,40,32,.12)}
.subject-card.winner{border-color:var(--forest);box-shadow:0 12px 28px rgba(47,72,56,.18);transform:translateY(-2px)}
.subject-card.hidden-search{display:none}
.card-coral{background:var(--coral)}.card-sage{background:var(--sage)}.card-sky{background:var(--sky)}.card-butter{background:var(--butter)}.card-lavender{background:var(--lavender)}.card-mint{background:var(--mint)}
.subj-left{display:flex;align-items:center;gap:12px;min-width:0}
.badge-box{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#FFFDF9;flex-shrink:0}
.badge-coral{background:var(--coral-badge)}.badge-sage{background:var(--sage-badge)}.badge-sky{background:var(--sky-badge)}.badge-butter{background:var(--butter-badge)}.badge-lavender{background:var(--lavender-badge)}.badge-mint{background:var(--mint-badge)}
.subj-text{display:flex;flex-direction:column;min-width:0}
.subj-code{font-size:15px;font-weight:800;color:var(--ink);line-height:1.15}
.subj-zh{font-size:11px;font-weight:600;color:rgba(39,36,32,.62);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subj-check{width:22px;height:22px;border-radius:50%;background:rgba(255,253,249,.75);color:var(--forest);display:grid;place-items:center;font-size:11px;font-weight:800;flex-shrink:0}
.subject-card.excluded .subj-check{background:rgba(39,36,32,.08);color:var(--ink-muted)}
.bento-bottom{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
.panel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:20px 22px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:14px;min-height:220px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-title-wrap{display:flex;flex-direction:column;gap:2px}
.panel-title{font-size:15px;font-weight:700;color:var(--ink)}
.panel-sub{font-size:12px;color:var(--ink-muted)}
.text-btn{border:none;background:var(--surface-soft);color:var(--ink-muted);height:28px;padding:0 12px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.text-btn:hover{background:#EAE0D3;color:var(--ink)}
.history-list{display:flex;flex-direction:column;gap:8px;max-height:168px;overflow-y:auto}
.history-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:14px;background:var(--surface-soft)}
.history-left{display:flex;align-items:center;gap:10px;min-width:0}
.mini-badge{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#FFFDF9;flex-shrink:0}
.history-label{font-size:13px;font-weight:700;color:var(--ink)}
.history-sub{font-size:11px;color:var(--ink-muted)}
.history-time{font-size:11px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.empty-state{font-size:12px;color:var(--ink-subtle);padding:22px 0;text-align:center}
.mix-strip{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:3px;background:var(--surface-soft)}
.mix-seg{height:100%;border-radius:99px;transition:flex-grow .45s var(--spring)}
.mix-list{display:flex;flex-direction:column;gap:10px;margin-top:2px}
.mix-row{display:flex;align-items:center;gap:10px}
.mix-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.mix-name{width:40px;font-size:12px;font-weight:700;color:var(--ink);flex-shrink:0}
.mix-track{flex:1;height:8px;border-radius:99px;background:var(--surface-soft);overflow:hidden}
.mix-fill{height:100%;border-radius:99px;transition:width .5s var(--spring)}
.mix-count{width:34px;text-align:right;font-size:11px;font-weight:700;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.mobile-dock{display:none}
.backdrop{display:none;position:fixed;inset:0;background:rgba(39,36,32,.24);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:35}
.backdrop.open{display:block}
@media(max-width:1023px){.app-shell{padding:16px;gap:0}.sidebar{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;height:calc(100dvh - max(28px,env(safe-area-inset-top) + env(safe-area-inset-bottom)));transform:translateX(calc(-100% - 24px));box-shadow:0 20px 50px rgba(39,36,32,.18)}.sidebar.open{transform:translateX(0)}.menu-trigger{display:grid}.bento-top{grid-template-columns:1fr}.subject-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.bento-bottom{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:767px){.app-shell{padding:0 14px calc(92px + env(safe-area-inset-bottom))}.main{padding-top:0;gap:16px}.topbar{position:sticky;top:0;z-index:25;margin:0 -14px;padding:calc(6px + env(safe-area-inset-top)) 14px 10px;background:rgba(250,244,236,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.search-pill{display:none}.hero-card{flex-direction:column-reverse;align-items:stretch;padding:20px;min-height:auto;gap:14px}.hero-visual,#ambientCanvas{width:136px;height:136px;margin:0 auto}.subject-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.subject-card{padding:12px 13px;min-height:76px}.bento-bottom{grid-template-columns:1fr;gap:14px}.panel-card{padding:18px}.mobile-dock{display:flex;position:fixed;left:14px;right:14px;bottom:max(12px,env(safe-area-inset-bottom));height:62px;background:rgba(210,219,206,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,253,249,.55);border-radius:22px;padding:6px 10px;align-items:center;justify-content:space-around;box-shadow:0 12px 32px rgba(39,36,32,.12);z-index:30}.dock-btn{width:46px;height:46px;border-radius:15px;border:none;background:transparent;color:#465045;display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .2s var(--spring),color .2s}.dock-btn.active{background:var(--bg);color:var(--ink);box-shadow:0 3px 10px rgba(39,36,32,.08)}.dock-btn:active{transform:scale(.92)}}
</style>

<div class="backdrop" id="backdrop"></div>
<div class="app-shell">

<script>(function(){document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});let lastTouchEnd=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},{passive:false});if('serviceWorker'in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js').catch(()=>{})}

const SUBJECTS=[
{id:'chem',code:'Chem',zh:'化學 Chemistry',cardClass:'card-coral',badgeClass:'badge-coral',color:'#E48567',svg:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v5.5L5.2 17.6A2 2 0 0 0 7 20.5h10a2 2 0 0 0 1.8-2.9L14 8.5V3"/><path d="M7.2 15h9.6"/><circle cx="10.5" cy="17.5" r=".9" fill="currentColor" stroke="none"/><circle cx="13.8" cy="16.8" r=".7" fill="currentColor" stroke="none"/></svg>'},
{id:'bio',code:'Bio',zh:'生物 Biology',cardClass:'card-sage',badgeClass:'badge-sage',color:'#769780',svg:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4c0 4 10 4 10 8s-10 4-10 8"/><path d="M17 4c0 4-10 4-10 8s10 4 10 8"/><line x1="8.5" y1="6.5" x2="15.5" y2="6.5"/><line x1="9.5" y1="12" x2="14.5" y2="12"/><line x1="8.5" y1="17.5" x2="15.5" y2="17.5"/></svg>'},
{id:'eng',code:'Eng',zh:'英文 English',cardClass:'card-sky',badgeClass:'badge-sky',color:'#6D8FB2',svg:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5A2.5 2.5 0 0 1 4.5 4H11v15H4.5A2.5 2.5 0 0 0 2 21V6.5z"/><path d="M22 6.5A2.5 2.5 0 0 0 19.5 4H13v15h6.5a2.5 2.5 0 0 1 2.5 2.5V6.5z"/><line x1="5.5" y1="8.5" x2="8.5" y2="8.5"/><line x1="5.5" y1="12" x2="8.5" y2="12"/><line x1="15.5" y1="8.5" x2="18.5" y2="8.5"/><line x1="15.5" y1="12" x2="18.5" y2="12"/></svg>'},
{id:'math',code:'Math',zh:'數學 Mathematics',cardClass:'card-butter',badgeClass:'badge-butter',color:'#E1B14C',svg:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14"/><path d="M9 7v11"/><path d="M15 7v8.5a2.5 2.5 0 0 0 3.5 2.3"/><circle cx="6" cy="17.5" r="1" fill="currentColor" stroke="none"/></svg>'},
{id:'ict',code:'ICT',zh:'資訊科技 ICT',cardClass:'card-lavender',badgeClass:'badge-lavender',color:'#8B74B8',svg:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="3"/><polyline points="8.5 9.5 6 12 8.5 14.5"/><polyline points="15.5 9.5 18 12 15.5 14.5"/><line x1="13" y1="8.5" x2="11" y2="15.5"/></svg>'},
{id:'chi',code:'Chi',zh:'中文 Chinese',cardClass:'card-mint',badgeClass:'badge-mint',color:'#579989',svg:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><line x1="12" y1="7" x2="12" y2="9.5"/><line x1="7.5" y1="10" x2="16.5" y2="10"/><path d="M14.5 10c-.6 3.5-2.8 6-6.5 7.5"/><path d="M9.5 12.2c1.4 2.2 3.6 4 6.5 5.2"/></svg>'}
];

const greetingTitle=document.getElementById('greetingTitle'),liveDate=document.getElementById('liveDate'),liveClock=document.getElementById('liveClock'),DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function updateClock(){const now=new Date(),h=now.getHours(),m=String(now.getMinutes()).padStart(2,'0'),hh=String(h).padStart(2,'0');let greet='Good evening, Wesley';if(h<12)greet='Good morning, Wesley';else if(h<18)greet='Good afternoon, Wesley';greetingTitle.textContent=greet;liveDate.textContent=DAYS[now.getDay()]+' '+now.getDate()+' '+MONTHS[now.getMonth()];liveClock.textContent=hh+':'+m}
updateClock();setInterval(updateClock,15000);

const sidebar=document.getElementById('sidebar'),backdrop=document.getElementById('backdrop');
document.getElementById('collapseBtn').addEventListener('click',()=>{if(window.innerWidth<1024){sidebar.classList.remove('open');backdrop.classList.remove('open')}else{sidebar.classList.toggle('collapsed')}});
document.getElementById('menuBtn').addEventListener('click',()=>{sidebar.classList.add('open');backdrop.classList.add('open')});
backdrop.addEventListener('click',()=>{sidebar.classList.remove('open');backdrop.classList.remove('open')});

let enabledIds=new Set(SUBJECTS.map(s=>s.id)),drawnInRound=new Set(),noRepeatMode=false,isRolling=false,winnerId=null,orbCoreColor='#E58565';
let counts=Object.fromEntries(SUBJECTS.map(s=>[s.id,0])),history=[];
try{const saved=JSON.parse(localStorage.getItem('wesley_draw_v1')||'null');if(saved){if(saved.counts)counts=Object.assign(counts,saved.counts);if(Array.isArray(saved.history))history=saved.history.slice(0,20)}}catch(e){}
function persist(){try{localStorage.setItem('wesley_draw_v1',JSON.stringify({counts,history:history.slice(0,20)}))}catch(e){}}

const subjectGrid=document.getElementById('subjectGrid'),drawStatusChip=document.getElementById('drawStatusChip'),heroIconBox=document.getElementById('heroIconBox'),heroResultCode=document.getElementById('heroResultCode'),heroResultName=document.getElementById('heroResultName'),drawStage=document.getElementById('drawStage'),drawBtn=document.getElementById('drawBtn'),drawBtnText=document.getElementById('drawBtnText'),modeToggleBtn=document.getElementById('modeToggleBtn'),poolRing=document.getElementById('poolRing'),poolPct=document.getElementById('poolPct'),poolHint=document.getElementById('poolHint'),historyList=document.getElementById('historyList'),historyCountLabel=document.getElementById('historyCountLabel'),mixStrip=document.getElementById('mixStrip'),mixList=document.getElementById('mixList'),totalDrawsLabel=document.getElementById('totalDrawsLabel'),searchInput=document.getElementById('searchInput');

function getActivePool(){return SUBJECTS.filter(s=>enabledIds.has(s.id)&&(!noRepeatMode||!drawnInRound.has(s.id)))}

function renderGrid(rollingId){
const q=(searchInput.value||'').trim().toLowerCase();
subjectGrid.innerHTML='';
SUBJECTS.forEach(s=>{
const btn=document.createElement('button');
btn.type='button';
const isEnabled=enabledIds.has(s.id),isMatch=!q||s.code.toLowerCase().includes(q)||s.zh.toLowerCase().includes(q);
btn.className='subject-card '+s.cardClass+(isEnabled?'':' excluded')+(rollingId===s.id?' rolling':'')+(winnerId===s.id&&!rollingId?' winner':'')+(isMatch?'':' hidden-search');
btn.innerHTML='<div class="subj-left"><div class="badge-box '+s.badgeClass+'">'+s.svg+'</div><div class="subj-text"><span class="subj-code">'+s.code+'</span><span class="subj-zh">'+s.zh+'</span></div></div><div class="subj-check">'+(isEnabled?(noRepeatMode&&drawnInRound.has(s.id)?'·':'✓'):'✕')+'</div>';
btn.addEventListener('click',()=>{if(isRolling)return;if(enabledIds.has(s.id)){if(enabledIds.size>1)enabledIds.delete(s.id)}else{enabledIds.add(s.id)}updatePoolUI();renderGrid()});
subjectGrid.appendChild(btn)})
}

function updatePoolUI(){
const totalEnabled=enabledIds.size,pool=getActivePool(),circ=2*Math.PI*18;
const ratio=totalEnabled?pool.length/totalEnabled:0;
poolRing.style.strokeDashoffset=(circ*(1-ratio)).toFixed(1);
poolPct.textContent=pool.length+'/'+totalEnabled;
poolHint.textContent=noRepeatMode?'不重複模式 · 剩餘 '+pool.length+' / '+totalEnabled+' 科':'已啟用 '+totalEnabled+' 個科目 · 點擊右側卡片可開關';
if(!isRolling&&!winnerId)drawStatusChip.textContent='就緒 · '+pool.length+' 科待抽';
modeToggleBtn.textContent=noRepeatMode?'不重複':'可重複';
modeToggleBtn.classList.toggle('active',noRepeatMode);
}

function renderHistory(){
historyCountLabel.textContent=history.length?'最近 '+history.length+' 筆結果':'尚未有抽籤紀錄';
if(!history.length){historyList.innerHTML='<div class="empty-state">按下「開始抽籤」後，這裡會顯示最近抽取結果</div>';return}
historyList.innerHTML=history.map((item,idx)=>{
const s=SUBJECTS.find(x=>x.id===item.id)||SUBJECTS[0];
return '<div class="history-item"><div class="history-left"><div class="mini-badge '+s.badgeClass+'">'+s.svg+'</div><div><div class="history-label">#'+(history.length-idx)+' · '+s.code+'</div><div class="history-sub">'+s.zh+'</div></div></div><div class="history-time">'+item.time+'</div></div>'
}).join('')
}

function renderStats(){
const total=Object.values(counts).reduce((a,b)=>a+b,0);
totalDrawsLabel.textContent='累計 '+total+' 次抽籤';
mixStrip.innerHTML=SUBJECTS.map(s=>'<div class="mix-seg" style="flex:'+(total?Math.max(counts[s.id],0.15):1)+';background:'+s.color+';opacity:'+(total&&counts[s.id]===0?'.25':'1')+'"></div>').join('');
mixList.innerHTML=SUBJECTS.map(s=>{
const c=counts[s.id]||0,pct=total?Math.round((c/total)*100):0;
return '<div class="mix-row"><span class="mix-dot" style="background:'+s.color+'"></span><span class="mix-name">'+s.code+'</span><div class="mix-track"><div class="mix-fill" style="width:'+pct+'%;background:'+s.color+'"></div></div><span class="mix-count">'+c+'次</span></div>'
}).join('')
}

function randIndex(max){
if(window.crypto&&window.crypto.getRandomValues){const arr=new Uint32Array(1);window.crypto.getRandomValues(arr);return arr[0]%max}
return Math.floor(Math.random()*max)
}

function showSubjectInHero(s,isFinal){
heroIconBox.style.background=s.color;
heroIconBox.innerHTML=s.svg;
heroResultCode.textContent=s.code;
heroResultName.textContent=s.zh;
orbCoreColor=s.color;
if(isFinal){drawStage.classList.add('pop');setTimeout(()=>drawStage.classList.remove('pop'),260)}
}

function startDraw(){
if(isRolling)return;
let pool=getActivePool();
if(!pool.length){drawnInRound.clear();pool=getActivePool()}
if(!pool.length)return;
isRolling=true;drawBtn.disabled=true;drawBtnText.textContent='抽取中…';drawStatusChip.textContent='抽取中 · 隨機跳選';
const target=pool[randIndex(pool.length)];
const steps=14;let step=0;
function tick(){
const preview=pool[step%pool.length];
showSubjectInHero(preview,false);
renderGrid(preview.id);
step++;
if(step<steps){setTimeout(tick,55+step*14)}
else{
isRolling=false;winnerId=target.id;
if(noRepeatMode)drawnInRound.add(target.id);
counts[target.id]=(counts[target.id]||0)+1;
const now=new Date(),tStr=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
history.unshift({id:target.id,time:tStr});if(history.length>20)history.pop();
persist();
showSubjectInHero(target,true);
drawBtn.disabled=false;drawBtnText.textContent='再抽一次';drawStatusChip.textContent='已抽中 · '+target.code;
renderGrid();updatePoolUI();renderHistory();renderStats()
}}
tick()
}

drawBtn.addEventListener('click',startDraw);
document.getElementById('sideDrawBtn').addEventListener('click',()=>{if(window.innerWidth<1024){sidebar.classList.remove('open');backdrop.classList.remove('open')}startDraw()});
modeToggleBtn.addEventListener('click',()=>{if(isRolling)return;noRepeatMode=!noRepeatMode;drawnInRound.clear();updatePoolUI();renderGrid()});
document.getElementById('resetPoolBtn').addEventListener('click',()=>{if(isRolling)return;enabledIds=new Set(SUBJECTS.map(s=>s.id));drawnInRound.clear();winnerId=null;orbCoreColor='#E58565';heroIconBox.style.background='#2F4838';heroIconBox.innerHTML='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.4 5.2L20 10l-5.6 1.8L12 17l-2.4-5.2L4 10l5.6-1.8L12 3z"/></svg>';heroResultCode.textContent='準備抽籤';heroResultName.textContent='點擊下方按鈕隨機抽取科目';drawBtnText.textContent='開始抽籤';updatePoolUI();renderGrid()});
document.getElementById('clearHistoryBtn').addEventListener('click',()=>{history=[];persist();renderHistory()});
document.getElementById('resetStatsBtn').addEventListener('click',()=>{counts=Object.fromEntries(SUBJECTS.map(s=>[s.id,0]));persist();renderStats()});
searchInput.addEventListener('input',()=>renderGrid());
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchInput.focus()}});

function handleNavAction(act){
if(window.innerWidth<1024){sidebar.classList.remove('open');backdrop.classList.remove('open')}
if(act==='draw')startDraw();
else if(act==='select-all'){enabledIds=new Set(SUBJECTS.map(s=>s.id));drawnInRound.clear();updatePoolUI();renderGrid()}
else if(act==='toggle-mode'){noRepeatMode=!noRepeatMode;drawnInRound.clear();updatePoolUI();renderGrid()}
else if(act==='clear-history'){history=[];persist();renderHistory()}
}
document.querySelectorAll('.nav-item,.dock-btn').forEach(btn=>btn.addEventListener('click',()=>handleNavAction(btn.dataset.action)));

const canvas=document.getElementById('ambientCanvas'),ctx=canvas.getContext('2d');let angle=0;
function drawOrbital(){
const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2;
ctx.clearRect(0,0,w,h);
ctx.beginPath();ctx.arc(cx,cy+7,138,0,Math.PI*2);ctx.fillStyle='rgba(47,40,32,.11)';ctx.fill();
ctx.beginPath();ctx.arc(cx,cy,140,0,Math.PI*2);ctx.fillStyle='#2F4838';ctx.fill();
[112,84,56].forEach((r,i)=>{ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='#476552';ctx.lineWidth=i===0?2:1.5;ctx.stroke()});
ctx.beginPath();ctx.arc(cx,cy,112,angle,angle+Math.PI*.65);ctx.strokeStyle='#F8E3B5';ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();
const x1=cx+Math.cos(angle)*112,y1=cy+Math.sin(angle)*112;
ctx.beginPath();ctx.arc(x1,y1,8,0,Math.PI*2);ctx.fillStyle='#FAF4EC';ctx.fill();
const x2=cx+Math.cos(-angle*1.4+1.2)*84,y2=cy+Math.sin(-angle*1.4+1.2)*84;
ctx.beginPath();ctx.arc(x2,y2,6.5,0,Math.PI*2);ctx.fillStyle=orbCoreColor;ctx.fill();
const grad=ctx.createRadialGradient(cx-7,cy-7,5,cx,cy,38);grad.addColorStop(0,'#FFFDF9');grad.addColorStop(.55,'#F8E3B5');grad.addColorStop(1,orbCoreColor);
ctx.beginPath();ctx.arc(cx,cy,36,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
ctx.fillStyle='#2F4838';ctx.font='700 22px -apple-system,BlinkMacSystemFont,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('W',cx,cy+1);
angle+=isRolling?0.055:0.008;requestAnimationFrame(drawOrbital)
}
drawOrbital();
renderGrid();updatePoolUI();renderHistory();renderStats()})();</script>
</body>
</html>
